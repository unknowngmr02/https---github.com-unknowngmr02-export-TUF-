name: Render HyperFrames (Custom Path)

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Path to the HyperFrames project folder"
        required: true
        default: "Trigonometry/q1"

      output_path:
        description: "Output MP4 path (relative to repository root)"
        required: true
        default: "render/q1.mp4"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify Environment
        run: |
          node -v
          npm -v
          ffmpeg -version
          ffprobe -version

      - name: Create Output Directory
        run: |
          mkdir -p "$(dirname "${{ github.event.inputs.output_path }}")"

      - name: Render Video
        working-directory: ${{ github.event.inputs.project_path }}
        run: |
          npx hyperframes render \
            --quality high \
            --fps 60 \
            --resolution 4k \
            --output "../../${{ github.event.inputs.output_path }}"

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: ${{ github.event.inputs.output_path }}
          if-no-files-found: error