name: Render HyperFrames

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify Environment
        run: |
          node -v
          npm -v
          ffmpeg -version
          ffprobe -version

      - name: Render All Videos
        env:
          CI: true
        run: |
          node render-all.js

      - name: Upload Renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-renders
          path: all-renders
          if-no-files-found: warn

      - name: Upload Individual Render Folders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-logs
          path: |
            speed time and distance/**/renders
          if-no-files-found: ignore