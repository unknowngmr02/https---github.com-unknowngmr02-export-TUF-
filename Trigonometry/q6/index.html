<script>
  apt.setStackLine("#line-g-1", "#stack-given .step-circle", "#stack-step1 .step-circle");
  apt.setStackLine("#line-1-2", "#stack-step1 .step-circle", "#stack-step2 .step-circle");
  apt.setStackLine("#line-2-3", "#stack-step2 .step-circle", "#stack-step3 .step-circle");

  const tl = gsap.timeline({ paused: true });

  // PHASE 1 - Question reveal
  const HERO_OFFSET_Y = 180;
  const RISE_TIME = 3.6;
  apt.heroEnterLowered(tl, "#q-full-card", HERO_OFFSET_Y, RISE_TIME);

  tl.fromTo("#serial-num",
    { scale: 0, rotation: -45, opacity: 0, y: HERO_OFFSET_Y },
    { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(2)", y: HERO_OFFSET_Y },
    0.8);
  tl.to("#serial-num", { y: 0, duration: 0.6, ease: "power2.inOut" }, RISE_TIME);

  // PHASE 2 - Pin (no illustration this question, pure standard-value recall)
  const PIN_TIME = 9.0;
  const GIVEN_TIME = 9.8;
  apt.pinFlow(tl, "#q-full-card", "#q-pinned", PIN_TIME);
  apt.fadeOut(tl, "#serial-num", PIN_TIME, 0.5);

  apt.cardEnter(tl, "#card-given .solution-card", GIVEN_TIME);
  apt.textReveal(tl, "#card-given .math");

  // STEP 1
  apt.morphToStack(tl, "#card-given .solution-card", "#stack-given .stack-card", 15.74);
  apt.cardEnter(tl, "#card-step1 .solution-card", 15.94);
  apt.textReveal(tl, "#card-step1 .math");

  // STEP 2
  apt.morphToStack(tl, "#card-step1 .solution-card", "#stack-step1 .stack-card", 19.18);
  apt.stackLineGrow(tl, "#line-g-1", 19.18);
  apt.cardEnter(tl, "#card-step2 .solution-card", 19.38);
  apt.textReveal(tl, "#card-step2 .math");

  // STEP 3
  apt.morphToStack(tl, "#card-step2 .solution-card", "#stack-step2 .stack-card", 22.44);
  apt.stackLineGrow(tl, "#line-1-2", 22.44);
  apt.cardEnter(tl, "#card-step3 .solution-card", 22.64);
  apt.textReveal(tl, "#card-step3 .math");

  // Recenter before options
  const RECENTER_TIME = 28.06;
  apt.recenterForOptions(tl, "#q-pinned", 160, 180, RECENTER_TIME);

  // PHASE 3 - Options reveal
  apt.morphToStack(tl, "#card-step3 .solution-card", "#stack-step3 .stack-card", 28.06);
  apt.stackLineGrow(tl, "#line-2-3", 28.06);
  apt.fadeIn(tl, "#options-reveal", 28.70);
  apt.optionsStagger(tl, ".opt-btn", 29.10);
  apt.correctPulse(tl, ".opt-btn.correct", 30.16);

  // END FADE
  const END_FADE_TIME = 33.0;
  apt.fadeOut(tl, "#root > div", END_FADE_TIME, 1.0);

  tl.set({},{},34)

  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
</script>
