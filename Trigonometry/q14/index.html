  // Quiet "no triangle needed" beat - a single small pulse, no new geometry

  // PHASE 2 - Pin (question only, no illustration pin for this question)
  const PIN_TIME = 19.4;
  const GIVEN_TIME = 21.6;

  apt.pinFlow(tl, "#q-full-card", "#q-pinned", PIN_TIME);
  apt.fadeOut(tl, "#serial-num", PIN_TIME, 0.5);

  apt.cardEnter(tl, "#card-given .solution-card", GIVEN_TIME);
  apt.textReveal(tl, "#card-given .math");

  // STEP 1 - morph Given into stack
  apt.morphToStack(tl, "#card-given .solution-card", "#stack-given .stack-card", 25.6);
  apt.cardEnter(tl, "#card-step1 .solution-card", 26.7);
  apt.textReveal(tl, "#card-step1 .math");

  // STEP 2 - Step 1 joins the stack, grow connector line

  apt.stackLineGrow(tl, "#line-g-1", 33.6);
  apt.cardEnter(tl, "#card-step2 .solution-card", 34.7);
  apt.textReveal(tl, "#card-step2 .math");

  // Recenter - clear center stage before options (no pinned illustration to fade)
  const RECENTER_TIME = 38.6;

  // PHASE 3 - Options reveal - Step 2 morphs straight into the options moment
  apt.fadeOut(tl, "#card-step2 .solution-card", RECENTER_TIME, 0.4);
  apt.fadeIn(tl, "#options-reveal", 39.3);
  apt.optionsStagger(tl, ".opt-btn", 39.7);
  apt.correctPulse(tl, ".opt-btn.correct", 41.2);
