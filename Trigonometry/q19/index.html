<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="animations.js"></script>
<script>
  apt.setStackLine("#line-g-1", "#stack-given .step-circle", "#stack-step1 .step-circle");

  const tl = gsap.timeline({ paused: true });

  // PHASE 1 - Question reveal
  const HERO_OFFSET_Y = 180;
  const RISE_TIME = 4.32; // end of "Now in this problem," - question then read aloud
  apt.heroEnterLowered(tl, "#q-full-card", HERO_OFFSET_Y, RISE_TIME);

  tl.fromTo("#serial-num",
    { scale: 0, rotation: -45, opacity: 0, y: HERO_OFFSET_Y },
    { scale: 1, rotation: 0, opacity: 1, y: HERO_OFFSET_Y, duration: 0.55, ease: "back.out(2)" },
    0.8);
  tl.to("#serial-num", { y: 0, duration: 0.6, ease: "power2.inOut" }, RISE_TIME);

  // PHASE 2 - Pin, then Given (no illustration in this question - pure identity)
  const PIN_TIME = 16.02;
  const GIVEN_TIME = 16.9;

  apt.pinFlow(tl, "#q-full-card", "#q-pinned", PIN_TIME);
  apt.fadeOut(tl, "#serial-num", PIN_TIME, 0.5);

  apt.cardEnter(tl, "#card-given .solution-card", GIVEN_TIME);
  apt.textReveal(tl, "#card-given .math");

  // STEP 1 - rearrange, morph Given into stack
  apt.morphToStack(tl, "#card-given .solution-card", "#stack-given .stack-card", 21.6);
  apt.cardEnter(tl, "#card-step1 .solution-card", 22.4);
  apt.textReveal(tl, "#card-step1 .math");

  // Step 1 joins the stack
  apt.morphToStack(tl, "#card-step1 .solution-card", "#stack-step1 .stack-card", 29.04);
  apt.stackLineGrow(tl, "#line-g-1", 29.04);

  // Recenter - align the pinned question against the options column before reveal.
  const RECENTER_TIME = 30.24;
  apt.recenterForOptions(tl, "#q-pinned", 160, 180, RECENTER_TIME);

  // PHASE 3 - Options reveal
  apt.fadeIn(tl, "#options-reveal", 30.74);
  apt.optionsStagger(tl, ".opt-btn", 31.24);
  apt.correctPulse(tl, ".opt-btn.correct", 41.86);

  // END FADE
  const END_FADE_TIME = 42.9;
  apt.fadeOut(tl, "#root > div", END_FADE_TIME, 1.2);

  tl.set({},{},45)

  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
</script>
