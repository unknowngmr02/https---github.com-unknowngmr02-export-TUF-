<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Card</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }

    .card-wrap {
      position: relative;
      width: 90vw;
      max-width: 1600px;
      height: 420px;
    }

    .card-shadow {
      position: absolute;
      inset: 0;
      background: #000000;
      border-radius: 42px;
      transform: translate(7px, 7px);
    }

    .question-card {
      position: absolute;
      inset: 0;
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 42px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="card-wrap">
    <div class="card-shadow"></div>
    <div class="question-card"></div>
  </div>
</body>
</html>
